# On a version tag: test, build web/ (base /satya/), publish web-dist.zip (+ gallery) as a release asset,
# deploy satya-api, then ask aj-platform to redeploy the Pages site (which pulls the new web-dist.zip).
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PLATFORM_DISPATCH_TOKEN (fine-grained PAT, actions:write
# on aj-platform). Worker secrets (SATYA_ADMIN_TOKEN, SATYA_OWNER_TOKEN, TAVILY_API_KEY) stay in Cloudflare.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Satya
      - uses: actions/checkout@v4
        with:
          repository: adityajajodia95/aj-demo-kit
          ref: v1.0.1
          path: aj-demo-kit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Satya/package-lock.json
      - run: npm ci
        working-directory: aj-demo-kit
      - run: npm ci
        working-directory: Satya
      - run: npm run check
        working-directory: Satya
      - name: Build web (copies gallery/ and results/benchmarks.json into the bundle)
        working-directory: Satya/web
        run: npm run build
      - name: Package web-dist.zip
        working-directory: Satya/web/dist
        run: zip -qr ../../web-dist.zip .
      - name: Publish the release asset
        working-directory: Satya
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" web-dist.zip --title "$GITHUB_REF_NAME" --generate-notes
      - name: Deploy only when the Cloudflare secrets are set
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set in this repository — skipping the deploy (checks still ran)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy satya-api
        if: steps.gate.outputs.deploy == 'true'
        working-directory: Satya/apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Redeploy the aj-demos site
        if: steps.gate.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
        run: gh workflow run deploy-site.yml --repo adityajajodia95/aj-platform
